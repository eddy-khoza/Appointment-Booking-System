services:
  backend:
    build: ./backend
    container_name: booking-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - app-net

  frontend:
    build: ./frontend
    container_name: booking-frontend
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - app-net

networks:
  app-net:
    driver: bridge